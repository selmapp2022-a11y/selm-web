<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>SELM</title>
    <script>
      // SELM-IA.md §1: the exam engine is no longer a separate app. This file
      // survives only to forward old links and bookmarks into the single app.
      // Old form was /exam.html#/attestation, /exam.html#/plan, etc.
      (function () {
        var h = (location.hash || '').replace(/^#/, '');
        var dest = (!h || h === '/') ? '/goal' : h;
        location.replace(dest + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
