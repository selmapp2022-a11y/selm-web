    <meta name="description" content="Practise the exact tasks your exam sets and get a score built the way an examiner builds one, with an honest confidence range. Which test Canada accepts, NCLC and CLB conversion, and how the scoring works." />

    <!-- ── WHAT A SEARCH ENGINE READS, AND WHY IT IS WRITTEN HERE ──────────

         A crawler asking for any route on this host is served this file, so
         these four lines are the entire description of the product as far as
         search is concerned. Until 31 August they said "AI-powered English
         learning across CEFR levels A1 to C2" — the positioning the company
         moved away from — and Google was publishing it, from a domain the
         company owns, above everything else a candidate might read.

         The description is the one selmapp.ca serves, word for word, because
         the two hosts are one product and a search engine that reads two
         descriptions has to choose between them.

         CANONICAL. selmapp.com and app.selmapp.ca serve the identical bundle,
         which is a genuine duplicate rather than a near one. The marketing
         site is selmapp.ca, so the app belongs under that brand and this tag
         names it. It is a tag rather than a redirect deliberately: it ships
         with the app, it is reversible in one line, and it needs no change to
         the platform's domain configuration. A 301 from selmapp.com is the
         stronger signal and remains available if that domain is ever retired.
    -->
    <link rel="canonical" href="https://app.selmapp.ca/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SELM" />
    <meta property="og:url" content="https://app.selmapp.ca/" />
    <meta property="og:title" content="SELM — Know your score before you book the exam" />
    <meta property="og:description" content="Four skills, scored the way the real examiner scores them — with an honest range, not a flattering number." />
    <meta property="og:image" content="https://selmapp.ca/images/icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SELM — Know your score before you book the exam" />
    <meta name="twitter:description" content="Four skills, scored the way the real examiner scores them — with an honest range, not a flattering number." />
    <meta name="twitter:image" content="https://selmapp.ca/images/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>SELM — Know your score before you book the exam</title>
